# Tests on every pull request, on each OS a personal instance may run on (ADR 0014); the web UI is built once and
# bundled into every OS's jar (ADR 0018).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  test:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: ui/dist
      - name: Build and test
        shell: bash
        run: ./mvnw --batch-mode -Pui verify
      - name: Start the web UI and read the overview
        shell: bash
        run: |
          java -jar target/dispatch-*[0-9].jar ui --no-browser --port 7879 --config "$RUNNER_TEMP/none.yaml" > "$RUNNER_TEMP/ui.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do grep -q 'http://127.0.0.1:7879/?t=' "$RUNNER_TEMP/ui.log" && break; sleep 1; done
          grep -q 'http://127.0.0.1:7879/?t=' "$RUNNER_TEMP/ui.log" || { cat "$RUNNER_TEMP/ui.log"; exit 1; }
          link=$(grep -o 'http://127.0.0.1:7879/?t=[A-Za-z0-9_-]*' "$RUNNER_TEMP/ui.log")
          curl -fsS -c "$RUNNER_TEMP/cookies" -o /dev/null "$link"
          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:7879/api/overview | tee "$RUNNER_TEMP/overview.json"
          grep -q '"configured":false' "$RUNNER_TEMP/overview.json"
          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:7879/ | grep -q '<div id="root">'
          kill "$pid"
      - name: Install and run (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DISPATCH_HOME="$RUNNER_TEMP/dispatch" DISPATCH_BIN="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/dispatch" --help
      - name: Install and run (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:DISPATCH_HOME = "$env:RUNNER_TEMP\dispatch"
          .\install.ps1
          & "$env:RUNNER_TEMP\dispatch\dispatch.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
