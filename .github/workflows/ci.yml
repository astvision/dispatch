# Tests on every pull request, on each OS a personal instance may run on (ADR 0014).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw --batch-mode verify
      - name: Launcher (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: cp target/dispatch-*.jar bin/dispatch.jar && bin/dispatch --help
      - name: Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for %%f in (target\dispatch-*.jar) do copy "%%f" bin\dispatch.jar
          call bin\dispatch.cmd --help
