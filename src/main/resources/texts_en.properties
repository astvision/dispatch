# Words Dispatch writes for a person, in English: the terminal, the log, and a page that asks for English.
# MessageFormat: {0} is an argument, and an apostrophe is written twice. texts_mn.properties has the same keys.

# Refusals a page gets from the server.
refusal.noApi=no such API: {0}
refusal.method={0} only answers {1}
refusal.tooLarge=the request is larger than {0} KiB
refusal.notJson=the request is not JSON
refusal.internal=something went wrong; the terminal running dispatch ui shows what
refusal.notAdmin=only an admin may manage Dispatch; ask one of them, or use dispatch ui on the machine
refusal.notAdminTasks=only an admin may see the whole group''s tasks
refusal.notYours=only the member who gave this task may see its plan and decide on it
refusal.cancelNotYours=only the member who gave this task, or an admin, may cancel it
refusal.ended=this task has already ended
refusal.retryNotYours=only the member who gave it may retry this task
refusal.retryNotFailed=only a failed task can be retried
refusal.answerEmpty=the answer is empty, or that option is not one of the question''s
refusal.answered=this question already has its answer
refusal.outOfOrder=answer the questions in order: an earlier one is still open
refusal.openQuestions=this plan still has open questions: answer them, and the agent plans again with the answers
refusal.notWaiting=this task is not waiting for a decision any more
refusal.stalePlan=this plan was replaced by a newer one, or no longer waits for you; reload the task
refusal.noTask=no task #{0} here
refusal.notMember=you are not in a group of this Dispatch
refusal.notMemberAskAdmin=you are not in a group of this Dispatch; ask an admin to add you
refusal.missingField={0} is missing
refusal.missingTaskId=which task? taskId is missing
refusal.wrongHost=This is not the address this Dispatch answers on.
refusal.unauthorized=open this page from the bot in Telegram
refusal.expired=this Mini App has been open too long; close it and open it again
refusal.sessionEnded=this page''s session ended; restart dispatch ui and open the link it prints
refusal.otherOrigin=this request did not come from the Dispatch page
refusal.groupAck=groupAck must be one of reaction, reactionAndLine, silent
refusal.changed=the config changed on disk since this page loaded it; reload to see the change

# Checks: what `dispatch check` prints and the Overview shows, one finding each.
check.configInvalid=config: {0}
check.config=config {0}
check.ghNotNeeded=gh: not needed here; members'' computers make the pull requests
check.botTokenShape=bot: TELEGRAM_BOT_TOKEN is not a bot token: @BotFather gives digits, a colon, then letters, digits, ''_'' and ''-''
check.topicsOn=topics on
check.topicsOff=topics off
check.bot=bot @{0} ({1})
check.botRefused=bot: Telegram refused the token or could not be reached ({0}); get a fresh one from @BotFather
check.installClaude=Claude Code
check.installCodex=the Codex CLI (npm install -g @openai/codex)
check.installGemini=the Gemini CLI (npm install -g @google/gemini-cli)
check.agentCannotRunTeam={0}: cannot run {1}; tasks run on members'' computers, but splitting a message with ✂️ still runs here (ADR 0013)
check.agentCannotRun={0}: cannot run {1}; install {2} or set agents.{0}.command to its full path
check.agentNotLoggedIn={0}: {1}, but not logged in: run {2} login
check.agent={0}: {1}
check.projectArea=project {0}
check.notCloned={0}: not cloned yet; Dispatch clones {1} into {2} when it starts
check.projectUnavailable={0}: {1}
check.noBaseBranch={0}: origin/{1} not found in {2}; run git fetch there, or fix baseBranch
check.project={0}: {1} (base {2})
check.noClaudeMd={0}: no CLAUDE.md on {1}, so every run first spends turns finding its way around; commit a short one with the layout and the build and test commands
check.stateNew=state {0} (created on the first run)
check.stateOpen=state {0} is open to other users ({1}); run: chmod o-rwx {0}
check.state=state {0}
check.stateUnreadable=state {0}: {1}
check.ghToken=gh: GH_TOKEN is set
check.ghLoggedIn=gh: logged in
check.ghNotLoggedIn=gh: not logged in or not installed ({0}); pull requests will fail until you run: gh auth login
check.workersLocal=workers: 127.0.0.1:{0} answers as this Dispatch
check.workersPublic=workers: {0} reaches this Dispatch
check.workersUnreachable=workers: {0} does not reach this Dispatch; members'' computers cannot connect until your tunnel or reverse proxy forwards it to 127.0.0.1:{1}
check.workersOther=workers: something other than Dispatch answers on 127.0.0.1:{0}; stop it or set another workers.port
check.workersNone=workers: nothing listens on 127.0.0.1:{0} yet; it starts with dispatch run
check.miniAppOff=miniApp: off; nothing is served to Telegram and the bot shows no Manage button
check.miniAppLocal=miniApp: 127.0.0.1:{0} answers as this Dispatch
check.miniAppPublic=miniApp: {0} reaches this Dispatch
check.miniAppUnreachable=miniApp: {0} does not answer over HTTPS as this Dispatch; Telegram cannot open the Mini App until your tunnel or reverse proxy forwards it to 127.0.0.1:{1}
check.miniAppOther=miniApp: something other than Dispatch answers on 127.0.0.1:{0}; stop it or set another miniApp.port
check.miniAppNone=miniApp: nothing listens on 127.0.0.1:{0} yet; it starts with dispatch run

# The background service, as the Overview shows it; the OS's own words for its state pass as they came.
