# Words Dispatch writes for a person, in English: the terminal, the log, and a page that asks for English.
# MessageFormat: {0} is an argument, and an apostrophe is written twice. texts_mn.properties has the same keys.

# Refusals a page gets from the server.
refusal.noApi=no such API: {0}
refusal.method={0} only answers {1}
refusal.tooLarge=the request is larger than {0} KiB
refusal.notJson=the request is not JSON
refusal.internal=something went wrong; the terminal running dispatch ui shows what
refusal.notAdmin=only an admin may manage Dispatch; ask one of them, or use dispatch ui on the machine
refusal.notAdminTasks=only an admin may see the whole group''s tasks
refusal.notYours=only the member who gave this task may see its plan and decide on it
refusal.cancelNotYours=only the member who gave this task, or an admin, may cancel it
refusal.ended=this task has already ended
refusal.retryNotYours=only the member who gave it may retry this task
refusal.retryNotFailed=only a failed task can be retried
refusal.answerEmpty=the answer is empty, or that option is not one of the question''s
refusal.answered=this question already has its answer
refusal.outOfOrder=answer the questions in order: an earlier one is still open
refusal.openQuestions=this plan still has open questions: answer them, and the agent plans again with the answers
refusal.notWaiting=this task is not waiting for a decision any more
refusal.stalePlan=this plan was replaced by a newer one, or no longer waits for you; reload the task
refusal.noTask=no task #{0} here
refusal.notMember=you are not in a group of this Dispatch
refusal.notMemberAskAdmin=you are not in a group of this Dispatch; ask an admin to add you
refusal.missingField={0} is missing
refusal.missingTaskId=which task? taskId is missing
refusal.wrongHost=This is not the address this Dispatch answers on.
refusal.unauthorized=open this page from the bot in Telegram
refusal.expired=this Mini App has been open too long; close it and open it again
refusal.sessionEnded=this page''s session ended; restart dispatch ui and open the link it prints
refusal.otherOrigin=this request did not come from the Dispatch page
refusal.groupAck=groupAck must be one of reaction, reactionAndLine, silent
refusal.changed=the config changed on disk since this page loaded it; reload to see the change

