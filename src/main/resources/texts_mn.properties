# Dispatch-ийн хүнд бичдэг үгс, монголоор: Монгол хэл сонгосон хуудсанд. texts_en.properties-тэй ижил түлхүүртэй.
# MessageFormat: {0} бол аргумент, апостроф хоёр удаа бичигдэнэ.

# Серверээс хуудсанд ирэх татгалзлууд.
refusal.noApi=Ийм API алга: {0}
refusal.method={0} зөвхөн {1} хүсэлт хүлээн авна
refusal.tooLarge=хүсэлт {0} KiB-аас их байна
