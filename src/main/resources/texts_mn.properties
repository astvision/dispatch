refusal.answered=энэ асуулт хариултаа авсан
refusal.outOfOrder=асуултуудад дарааллаар нь хариулна уу: өмнөх асуулт хариултгүй байна
refusal.openQuestions=энэ төлөвлөгөөнд хариулаагүй асуулт байна: хариулбал агент хариултыг тусгаж дахин төлөвлөнө
