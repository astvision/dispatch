check.workersNone=workers: 127.0.0.1:{0} дээр одоохондоо юу ч сонсохгүй байна; dispatch run-тай хамт эхэлнэ
check.miniAppOff=miniApp: унтраалттай; Telegram-д юу ч үзүүлэхгүй, бот Удирдах товч харуулахгүй
check.miniAppLocal=miniApp: 127.0.0.1:{0} энэ Dispatch-аар хариулж байна
check.miniAppPublic=miniApp: {0} энэ Dispatch-д хүрч байна
check.miniAppUnreachable=miniApp: {0} HTTPS-ээр энэ Dispatch болж хариулахгүй байна; туннель эсвэл reverse proxy чинь 127.0.0.1:{1} руу дамжуулах хүртэл Telegram Mini App-ийг нээж чадахгүй
check.miniAppOther=miniApp: 127.0.0.1:{0} дээр Dispatch биш өөр зүйл хариулж байна; түүнийг зогсоох эсвэл өөр miniApp.port тохируулна уу
check.miniAppNone=miniApp: 127.0.0.1:{0} дээр одоохондоо юу ч сонсохгүй байна; dispatch run-тай хамт эхэлнэ

