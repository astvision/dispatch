check.topicsOn=сэдэв асаалттай
check.topicsOff=сэдэв унтраалттай
check.bot=bot @{0} ({1})
check.botRefused=bot: Telegram токеныг хүлээж аваагүй эсвэл холбогдож чадсангүй ({0}); @BotFather-аас шинийг авна уу
check.installClaude=Claude Code
check.installCodex=Codex CLI (npm install -g @openai/codex)
check.installGemini=Gemini CLI (npm install -g @google/gemini-cli)
check.agentCannotRunTeam={0}: {1}-ийг ажиллуулж чадсангүй; даалгаврууд гишүүдийн компьютер дээр явна, гэхдээ ✂️-ээр мессеж хуваах нь энд ажилладаг (ADR 0013)
check.agentCannotRun={0}: {1}-ийг ажиллуулж чадсангүй; {2} суулгах эсвэл agents.{0}.command-д бүтэн замыг нь бичнэ үү
check.agentNotLoggedIn={0}: {1}, гэхдээ нэвтрээгүй байна: {2} login ажиллуулна уу
check.agent={0}: {1}
check.projectArea=төсөл {0}
check.notCloned={0}: клон хийгээгүй байна; Dispatch эхлэхдээ {1}-ийг {2} руу клон хийнэ
check.projectUnavailable={0}: {1}
check.noBaseBranch={0}: {2}-д origin/{1} олдсонгүй; тэнд git fetch ажиллуулах эсвэл baseBranch-ийг засна уу
check.project={0}: {1} (суурь {2})
check.noClaudeMd={0}: {1} дээр CLAUDE.md алга, тиймээс ажил болгон эхлээд замаа олох гэж алхам зарцуулна; бүтэц, build болон test командуудтай богино CLAUDE.md commit хийнэ үү
check.stateNew=state {0} (анхны ажлаар үүснэ)
check.stateOpen=state {0} бусад хэрэглэгчдэд нээлттэй ({1}); ажиллуулна уу: chmod o-rwx {0}
check.state=state {0}
check.stateUnreadable=state {0}: {1}
check.ghToken=gh: GH_TOKEN тохируулсан
check.ghLoggedIn=gh: нэвтэрсэн
check.ghNotLoggedIn=gh: нэвтрээгүй эсвэл суугаагүй ({0}); gh auth login ажиллуулах хүртэл pull request бүтэлгүйтнэ
check.workersLocal=workers: 127.0.0.1:{0} энэ Dispatch-аар хариулж байна
check.workersPublic=workers: {0} энэ Dispatch-д хүрч байна
check.workersUnreachable=workers: {0} энэ Dispatch-д хүрэхгүй байна; туннель эсвэл reverse proxy чинь 127.0.0.1:{1} руу дамжуулах хүртэл гишүүдийн компьютер холбогдож чадахгүй
