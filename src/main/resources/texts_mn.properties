refusal.stalePlan=энэ төлөвлөгөөг шинэ нь сольсон, эсвэл таныг хүлээхээ больсон; даалгаврыг дахин уншина уу
refusal.noTask=#{0} даалгавар энд алга
refusal.notMember=та энэ Dispatch-ийн бүлэгт байхгүй байна
refusal.notMemberAskAdmin=та энэ Dispatch-ийн бүлэгт байхгүй байна; админаас нэмүүлнэ үү
refusal.missingField={0} алга
refusal.missingTaskId=аль даалгавар вэ? taskId алга
refusal.wrongHost=Энэ Dispatch энэ хаягаар хариулдаггүй.
refusal.unauthorized=энэ хуудсыг Telegram дахь ботоос нээнэ үү
refusal.expired=Mini App хэт удаан нээлттэй байлаа; хаагаад дахин нээнэ үү
refusal.sessionEnded=энэ хуудасны сесс дууссан; dispatch ui-г дахин ажиллуулж, хэвлэсэн холбоосыг нь нээнэ үү
refusal.otherOrigin=энэ хүсэлт Dispatch-ийн хуудаснаас ирээгүй
refusal.groupAck=groupAck нь reaction, reactionAndLine, silent-ийн нэг байх ёстой
refusal.changed=энэ хуудас уншсанаас хойш тохиргооны файл өөрчлөгдсөн; өөрчлөлтийг харахын тулд дахин уншина уу

# Шалгалт: `dispatch check`-ийн хэвлэдэг, Тойм хуудасны харуулдаг мөрүүд.
check.configInvalid=config: {0}
check.config=config {0}
