task.usage=Хэрэглээ: <code>/task төсөл тайлбар</code>\nЭсвэл даалгавар бичсэн мессежид хариулж: <code>/task төсөл</code>
help=<b>Dispatch</b> багийн даалгаврыг AI агентаар шинжлүүлж, төлөвлөгөө гаргана. Төлөвлөгөөг зөвшөөрвөл хэрэгжүүлж, draft pull request нээнэ. Засах бол төлөвлөгөөнд хариу бичнэ.\n\n<code>/task төсөл тайлбар</code> — шинэ даалгавар (эсвэл мессежид хариулж <code>/task төсөл</code>)\n<code>/status</code> — одоо юу хийж байна\n<code>/history</code> — дууссан даалгаврууд, <code>/history дугаар</code> — нэг даалгаврын явц\n<code>/cancel дугаар</code> — даалгавар цуцлах\n<code>/help</code> — энэ тусламж\n\nКомандыг «/» цэснээс сонгох эсвэл <code>/task@{1}</code> гэж бичвэл Dispatch-д заавал хүрнэ.\n\nТөслүүд: {0}
help.private=<b>Dispatch</b>: таны өгсөн даалгаврын төлөвлөгөө, үр дүн энд ирнэ. Энд төлөвлөгөөг зөвшөөрч, татгалзаж эсвэл хариу бичиж засна.\n\n<code>/status</code> — одоо юу хийж байна\n<code>/history</code> — дууссан даалгаврууд, <code>/history дугаар</code> — нэг даалгаврын явц\n<code>/cancel дугаар</code> — даалгавар цуцлах\n<code>/help</code> — энэ тусламж\n\nШинэ даалгаврыг багийн группт <code>/task@{1} төсөл тайлбар</code> гэж өгнө. Төслүүд: {0}
