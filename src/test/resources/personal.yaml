# A personal instance's config, as dispatch init writes it (ADR 0014).
team: bold
stateDir: 'STATE_DIR'

telegram:
  groups:
    - name: bold
      members:
        - id: 123456789
          name: 'Bold'
      projects:
        - alm

delivery:
  authorName: 'Dispatch (Bold)'
  authorEmail: 'bold@example.com'

scheduler:
  maxConcurrentRuns: 1

limits:
  plan:
    timeout: 15m
    budgetUsd: 2
  execute:
    timeout: 60m
    budgetUsd: 10

agents:
  claude-code:
    command: 'claude'

projects:
  - name: alm
    path: 'CLONE'
    baseBranch: main
    agent: claude-code
