# /etc/dispatch/<team>.yaml - configuration for one team's instance.
team: backend

# stateDir defaults to $STATE_DIRECTORY, which systemd sets from StateDirectory=dispatch/<team>.
# stateDir: /var/lib/dispatch/backend

telegram:
  # admins: [123456789]           # who lets people join from Telegram: they get a button per group (ADR 0015)
  groups:                         # each group: its chat, its members, the projects it owns (ADR 0012)
    - name: backend
      chatId: -1001234567890      # the group's (negative) id; see README "Find the ids". Omit it for a personal bot (ADR 0014)
      members:                    # people who may give and cancel this group's tasks
        - id: 123456789
          name: Bold
        - id: 222333444
          name: Ali
      projects:                   # every project belongs to exactly one group
        - autoland-management

delivery:                         # Dispatch commits, pushes dispatch/<task> and opens a draft PR (ADR 0007)
  authorName: Dispatch (backend)
  authorEmail: dispatch-backend@users.noreply.github.com
  # ghCommand: /usr/bin/gh        # default: gh on PATH

workers:                          # required once a group has a chat: each member's tasks then run on their own computer
  publicUrl: https://team.example.com   # your tunnel or reverse proxy; members' workers reach this machine here
  port: 7880                      # Dispatch listens on 127.0.0.1:<port>; the proxy forwards to it

scheduler:
  maxConcurrentRuns: 2

# worktrees:
#   idleDays: 7                   # a finished task's worktree is removed after this many idle days; a follow-up recreates it

limits:
  plan:
    timeout: 15m                  # s, m or h
    budgetUsd: 2                  # --max-budget-usd per planning run (can overshoot slightly)
  execute:
    timeout: 60m
    budgetUsd: 10

agents:
  claude-code:
    command: /home/dispatch-backend/.local/bin/claude

projects:
  - name: autoland-management     # clone lives at <stateDir>/repos/autoland-management, unless path is set
    alias: alm
    repo: https://github.com/acme/autoland-management.git
    # path: /home/bold/work/autoland-management   # an existing clone anywhere, e.g. your own; repo is then optional
    baseBranch: main
    agent: claude-code
    # model: sonnet               # execution needs a model with auto mode (Sonnet, Opus); Haiku runs fail
    # effort: high                # low, medium, high, xhigh or max; Claude Code's default when unset
    # copyFiles: [.env]           # must be git-ignored; copied into worktrees for execution runs only
    # limits:
    #   plan: { timeout: 20m, budgetUsd: 3 }
    #   execute: { timeout: 90m, budgetUsd: 15 }
